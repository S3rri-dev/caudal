    id: problem
    attributes:
      label: Problema y ejemplo
      description: Usa información ficticia y explica el objetivo.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Comportamiento propuesto y alternativas
    validations:
      required: true
